<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sika | Card sandbox</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f7f8; color: #172421; font: 15px system-ui, sans-serif; }
    header { background: #fff; border-bottom: 1px solid #dce3e0; padding: 22px 28px; display:flex; gap:14px; align-items:center; }
    h1 { font-size: 21px; margin: 0; } h2 { font-size: 18px; margin:0 0 22px; }
    .badge { color:#865000; background:#fff0cc; padding:5px 9px; font-size:12px; }
    main { max-width:1100px; padding:32px 24px; margin:auto; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:36px; }
    section { min-width:0; } label { display:block; font-weight:600; margin:0 0 7px; }
    input,select,textarea { width:100%; padding:11px 12px; border:1px solid #aab9b2; border-radius:5px; background:white; color:#172421; font:inherit; }
    input:focus,select:focus,textarea:focus { outline:2px solid #087f68; outline-offset:2px; }
    .field { margin-bottom:18px; } .row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .settings { border-bottom:1px solid #dce3e0; margin-bottom:24px; padding-bottom:6px; }
    button { border:0; border-radius:5px; background:#08765f; color:white; padding:12px 18px; font:600 15px system-ui; cursor:pointer; }
    button:disabled { opacity:.5; cursor:not-allowed; } .secondary { background:#e1e9e5; color:#173f33; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; }
    .status { padding:13px; border-left:3px solid #08765f; background:#e7efec; margin-bottom:22px; overflow-wrap:anywhere; min-height:48px; }
    .status.error { border-color:#b82c39; background:#fdecee; color:#7e1723; }
    textarea { height:105px; font:13px ui-monospace,monospace; resize:vertical; overflow-wrap:anywhere; }
    pre { white-space:pre-wrap; overflow-wrap:anywhere; background:#fff; border:1px solid #dce3e0; border-radius:5px; padding:16px; min-height:180px; max-height:500px; overflow:auto; font:13px/1.6 ui-monospace,monospace; }
    .meta { color:#55665e; font-size:13px; overflow-wrap:anywhere; margin:16px 0; }
    .checkbox { display:flex; gap:10px; align-items:center; margin-bottom:20px; font-weight:400; } .checkbox input { width:18px; height:18px; }
    @media(max-width:720px) { main { grid-template-columns:1fr; padding:24px 18px; gap:28px; } header { padding:18px; flex-wrap:wrap; } }
  </style>
</head>
<body>
  <header><h1>Sika card sandbox</h1><span class="badge">TEST CARDS ONLY</span></header>
  <main>
    <section aria-labelledby="card-heading">
      <h2 id="card-heading">Card tokenization</h2>
      <div class="settings">
        <div class="field"><label for="public-key">Sandbox public key</label><input id="public-key" value="6071465d-ef2a-48f2-b6eb-b255563cd620" autocomplete="off" spellcheck="false"></div>
        <div class="field"><label for="test-card">Test card</label><select id="test-card"><option value="5555555555554444">Mastercard - 4444</option><option value="4444333322221111">Visa - 1111</option><option value="5163613613613613">Mastercard debit - 3613</option><option value="custom">Custom sandbox card</option></select></div>
      </div>
      <form id="payment-form" autocomplete="off">
        <div class="field"><label for="cardholder">Cardholder name</label><input id="cardholder" data-field="cardholder" value="AUTHORISED" required autocomplete="off"></div>
        <div class="field"><label for="pan">Test card number</label><input id="pan" data-field="pan" value="5555555555554444" inputmode="numeric" maxlength="19" pattern="[0-9]{13,19}" required autocomplete="off"></div>
        <div class="row">
          <div class="field"><label for="expiry">Expiry (MM/YY)</label><input id="expiry" data-field="expirationDate" placeholder="MM/YY" inputmode="numeric" maxlength="5" pattern="(0[1-9]|1[0-2])/[0-9]{2}" required autocomplete="off"></div>
          <div class="field"><label for="cvv">Test CVV</label><input id="cvv" data-field="securitycode" type="password" value="555" inputmode="numeric" maxlength="4" pattern="[0-9]{3,4}" required autocomplete="off"></div>
        </div>
        <label class="checkbox"><input type="checkbox" checked disabled>Reusable token</label>
        <div class="actions"><button id="submit" type="submit" disabled>Generate token</button><button id="clear" type="button" class="secondary">Clear result</button></div>
      </form>
    </section>
    <section aria-labelledby="result-heading">
      <h2 id="result-heading">Token result</h2>
      <div id="status" class="status" role="status" aria-live="polite">Loading Inyo sandbox tokenizer...</div>
      <div class="field"><label for="token">Card token</label><textarea id="token" readonly spellcheck="false"></textarea></div>
      <button id="copy" class="secondary" disabled type="button">Copy token</button>
      <p id="origin" class="meta"></p>
      <h2 style="margin-top:28px">Returned metadata</h2>
      <pre id="metadata">No response yet.</pre>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
